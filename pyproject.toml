[project]
name = "ai-content-bridge"
version = "0.1.0"
description = "CN→EN AI content localization platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "aiosqlite>=0.20.0",
    "sqlalchemy>=2.0.36",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.18",
    "PyJWT>=2.9.0",
    "stripe>=7.8.0",
    "email-validator>=2.0.0",
    "psycopg2-binary>=2.9.0",
]
[project.optional-dependencies]
social = [
    "tweepy>=4.14.0",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28.0",
]

[project.scripts]
bridge = "app.cli:main"
