[project]
name = "ai-content-bridge"
version = "0.1.0"
description = "CN→EN AI content localization platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "aiosqlite>=0.20.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "sqlalchemy[asyncio]>=2.0.36",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.18",
]
[project.optional-dependencies]
social = [
    "tweepy>=4.14.0",
]

[project.scripts]
bridge = "app.cli:main"
