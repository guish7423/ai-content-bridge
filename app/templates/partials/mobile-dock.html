<div class="dock" id="mobile-dock">
  <div class="dock__items">
    <a href="/" class="dock__item {% if request.url.path == '/' %}active{% endif %}">
      <span class="dock__item-icon"><i class="ph ph-house"></i></span>
      <span data-i18n="dock.home">首页</span>
    </a>
    <a href="/dashboard" class="dock__item {% if request.url.path == '/dashboard' %}active{% endif %}">
      <span class="dock__item-icon"><i class="ph ph-chart-bar"></i></span>
      <span data-i18n="dock.dashboard">仪表盘</span>
    </a>
    <a href="/pricing" class="dock__item {% if request.url.path == '/pricing' %}active{% endif %}">
      <span class="dock__item-icon"><i class="ph ph-diamond"></i></span>
      <span data-i18n="dock.pricing">定价</span>
    </a>
    <a href="/login" class="dock__item">
      <span class="dock__item-icon"><i class="ph ph-user"></i></span>
      <span data-i18n="dock.account">账户</span>
    </a>
  </div>
</div>
