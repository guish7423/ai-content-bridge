<div class="dock" id="mobile-dock">
  <div class="dock__items">
    <a href="/" class="dock__item {% if request.url.path == '/' %}active{% endif %}">
      <span class="dock__item-icon">🏠</span>
      <span data-i18n="dock.home">Home</span>
    </a>
    <a href="/dashboard" class="dock__item {% if request.url.path == '/dashboard' %}active{% endif %}">
      <span class="dock__item-icon">📊</span>
      <span data-i18n="dock.dashboard">Dashboard</span>
    </a>
    <a href="/pricing" class="dock__item {% if request.url.path == '/pricing' %}active{% endif %}">
      <span class="dock__item-icon">💎</span>
      <span data-i18n="dock.pricing">Pricing</span>
    </a>
    <a href="/login" class="dock__item">
      <span class="dock__item-icon">👤</span>
      <span data-i18n="dock.account">Account</span>
    </a>
  </div>
</div>
