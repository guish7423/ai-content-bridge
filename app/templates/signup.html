{% extends "base.html" %}
{% block title %}Sign Up - AI Content Bridge{% endblock %}
{% block content %}
<div class="auth-page flex flex-center" style="min-height:80vh">
  <div class="auth-card ks-card" style="max-width:420px;width:100%">
    <div class="text-center mb-lg">
      <h1 class="section__title" style="font-size:var(--cw-text-2xl)" data-i18n="signup.title">创建账号</h1>
      <p class="section__subtitle" style="font-size:var(--cw-text-sm)" data-i18n="signup.subtitle">开始把中文内容推向全球</p>
    </div>

    <form id="signup-form">
      <div class="ks-form-group">
        <label class="ks-label" for="name" data-i18n="signup.name">姓名</label>
        <input type="text" id="name" name="name" class="ks-input" placeholder="Your name" />
      </div>
      <div class="ks-form-group">
        <label class="ks-label" for="email" data-i18n="signup.email">邮箱</label>
        <input type="email" id="email" name="email" required class="ks-input" placeholder="you@example.com" />
      </div>
      <div class="ks-form-group">
        <label class="ks-label" for="password" data-i18n="signup.password">密码</label>
        <input type="password" id="password" name="password" required minlength="8" class="ks-input" />
        <small class="text-tertiary mt-xs" style="display:block;font-size:var(--cw-text-xs)" data-i18n="signup.password_hint">至少 8 个字符</small>
      </div>
      <div id="signup-error" class="ks-badge ks-badge--error mb-md" style="display:none"></div>
      <button type="submit" class="ks-button ks-button--primary ks-button--block" data-i18n="signup.submit">创建账号</button>
    </form>

    <p class="text-center mt-lg text-muted" style="font-size:var(--cw-text-sm)">
      <span data-i18n="signup.have_account">已有账号？</span>
      <a href="/login" data-i18n="signup.login">登录</a>
    </p>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('signup-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  var btn = this.querySelector('button[type="submit"]');
  var error = document.getElementById('signup-error');
  btn.disabled = true;
  btn.innerHTML = '<span class="ks-spinner"></span>';
  error.style.display = 'none';
  try {
    var resp = await fetch('/api/auth/signup-form', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email: this.email.value, password: this.password.value, name: this.name.value})
    });
    if (!resp.ok) {
      var data = await resp.json();
      throw new Error(data.detail || 'Registration failed');
    }
    window.location.href = '/dashboard';
  } catch (err) {
    error.textContent = err.message;
    error.style.display = 'flex';
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<span data-i18n="signup.submit">创建账号</span>';
  }
});
</script>
{% endblock %}
