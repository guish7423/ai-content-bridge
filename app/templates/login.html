<!DOCTYPE html>
<html lang="en" data-i18n-lang>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="login.title">Login - AI Content Bridge</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script defer src="/static/i18n.js"></script>
  <script defer src="/static/app.js"></script>
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="nav-brand">AI Content Bridge</a>
      <div class="nav-links">
        <a href="/pricing" data-i18n="nav.pricing">Pricing</a>
        <a href="/signup" data-i18n="nav.signup">Sign Up</a>
      </div>
    </div>
  </nav>

  <main class="main">
    <div class="auth-card">
      <h1 data-i18n="login.title">Welcome Back</h1>
      <p class="auth-subtitle" data-i18n="login.subtitle">Log in to your account</p>

      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label for="email" data-i18n="login.email">Email</label>
          <input type="email" id="email" name="email" required placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label for="password" data-i18n="login.password">Password</label>
          <input type="password" id="password" name="password" required placeholder="Your password" />
        </div>
        <button type="submit" class="btn btn-primary btn-block" data-i18n="login.submit">
          Log In
        </button>
      </form>

      <div id="login-error" class="alert alert-error" style="display:none"></div>

      <p class="auth-footer">
        <span data-i18n="login.no_account">Don't have an account?</span>
        <a href="/signup" data-i18n="login.signup">Sign up</a>
      </p>
    </div>
  </main>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const btn = form.querySelector('button[type="submit"]');
      const error = document.getElementById('login-error');

      btn.disabled = true;
      btn.textContent = 'Logging in…';
      error.style.display = 'none';

      try {
        const resp = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: form.email.value,
            password: form.password.value,
          }),
        });

        if (!resp.ok) {
          const data = await resp.json();
          throw new Error(data.detail || 'Login failed');
        }

        window.location.href = '/dashboard';
      } catch (err) {
        error.textContent = err.message;
        error.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Log In';
      }
    });
  </script>
</body>
</html>
