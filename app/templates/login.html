<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - AI Content Bridge</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <nav id="navbar">
    <div class="logo"><span>✦</span> Content Bridge</div>
    <div class="nav-links">
      <a href="/#features">Features</a>
      <a href="/pricing">Pricing</a>
      <a href="https://github.com/guish7423/ai-content-bridge" target="_blank">GitHub</a>
      <a href="/signup" class="btn btn-sm btn-primary">Sign Up</a>
    </div>
    <button class="hamburger" id="hamburger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </nav>
  <div class="mobile-nav" id="mobile-nav">
    <a href="/#features">Features</a>
    <a href="/pricing">Pricing</a>
    <a href="https://github.com/guish7423/ai-content-bridge" target="_blank">GitHub</a>
    <a href="/signup" class="btn btn-primary btn-lg">Sign Up</a>
  </div>

  <main class="main">
    <div class="auth-card">
      <h1>Welcome Back</h1>
      <p class="auth-subtitle">Log in to your account</p>
      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required placeholder="Your password" />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Log In</button>
      </form>
      <div id="login-error" class="alert alert-error" style="display:none"></div>
      <p class="auth-footer">
        <span>Don't have an account?</span>
        <a href="/signup">Sign up</a>
      </p>
    </div>
  </main>

  <footer class="footer">
    <p>Built with ❤️ for the global Chinese creator community</p>
    <p style="margin-top:4px; font-size:0.8rem; color:var(--text-dim)">
      <a href="https://github.com/guish7423/ai-content-bridge" style="color:var(--accent)">GitHub</a> · AI Content Bridge v0.1
    </p>
  </footer>

  <script src="/static/animations.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target, btn = form.querySelector('button[type="submit"]'), error = document.getElementById('login-error');
      btn.disabled = true; btn.textContent = 'Logging in\u2026'; error.style.display = 'none';
      try {
        const resp = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: form.email.value, password: form.password.value }) });
        if (!resp.ok) { const d = await resp.json(); throw new Error(d.detail || 'Login failed'); }
        window.location.href = '/dashboard';
      } catch (err) { error.textContent = err.message; error.style.display = 'block'; }
      finally { btn.disabled = false; btn.textContent = 'Log In'; }
    });
  </script>
</body>
</html>
